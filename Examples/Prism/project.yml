name: Prism

options:
  bundleIdPrefix: io.github.enebin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AnyChat:
    path: ../..

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: Prism
      - path: ../QuickStart/Shared/Media
        buildPhase: resources
    dependencies:
      - package: AnyChat
        product: AnyChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.enebin.prism
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos and videos to send in a chat.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record sound with videos you send in a chat.
        TARGETED_DEVICE_FAMILY: "1"

  PrismTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrismTests
    dependencies:
      - target: Prism
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.enebin.prism.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Prism:
    build:
      targets:
        Prism: all
        PrismTests: [test]
    test:
      config: Debug
      targets:
        - PrismTests
