<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.bubble{position:relative;border-radius:20px;padding:9px 14px;font-size:17px;line-height:22px;max-width:264px;box-sizing:border-box}
.tail{position:absolute;bottom:0;width:20px;height:18px}
.tail-cut{position:absolute;bottom:0;width:10px;height:20px}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.label}}; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 54px 16px 0 16px; height: 137px; box-sizing: border-box; flex-shrink: 0">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{c.glass}}; box-shadow: {{c.glassShadow}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="{{c.label}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center">
      <div style="width: 56px; height: 56px; border-radius: 28px; background: linear-gradient(180deg, #A5ABB9, #858994); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600">A</div>
      <div style="height: 30px; padding: 0 15px; border-radius: 15px; background: {{c.glass}}; box-shadow: {{c.glassShadow}}; display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 21px; font-weight: 700; margin-top: -4px">Alice<svg width="6" height="10" viewBox="0 0 6 10" aria-hidden="true"><path d="m1 1 4 4-4 4" fill="none" stroke="{{c.tertiary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    </div>
    <button aria-label="FaceTime" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{c.glass}}; box-shadow: {{c.glassShadow}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><rect x="1" y="1" width="13" height="12" rx="3" fill="none" stroke="{{c.label}}" stroke-width="1.8"></rect><path d="m15 5 6-3v10l-6-3z" fill="none" stroke="{{c.label}}" stroke-width="1.8" stroke-linejoin="round"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 12px 16px; overflow: hidden">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="10">
      <sc-if value="{{item.isTime}}" hint-placeholder-val="{{false}}">
        <p style="margin: {{item.margin}}; text-align: center; font-size: 11px; line-height: 13px; color: {{c.secondary}}"><span style="font-weight: 600">{{item.day}}</span>  {{item.time}}</p>
      </sc-if>
      <sc-if value="{{item.isBubble}}" hint-placeholder-val="{{true}}">
        <div class="bubble" style="{{item.bubbleStyle}}">
          <div style="position: relative; z-index: 1">{{item.text}}</div>
          <sc-if value="{{item.tail}}" hint-placeholder-val="{{false}}">
            <span class="tail" style="{{item.tailStyle}}"></span>
            <span class="tail-cut" style="{{item.cutStyle}}"></span>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
  </main>

  <footer style="display: flex; align-items: center; gap: 12px; padding: 0 28px; height: 70px; box-sizing: border-box; margin-bottom: 34px; flex-shrink: 0">
    <button aria-label="Add" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: {{c.glass}}; box-shadow: {{c.glassShadow}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2v14M2 9h14" stroke="{{c.label}}" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <label style="flex-grow: 1; height: 43px; border-radius: 21.5px; background: {{c.glass}}; box-shadow: {{c.glassShadow}}; display: flex; align-items: center; padding: 0 16px; box-sizing: border-box; gap: 8px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span>
      <input placeholder="Message" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 16px; line-height: 19px; color: {{c.label}}; outline: none">
      <svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><rect x="3" y="1" width="6" height="10" rx="3" fill="none" stroke="{{c.placeholder}}" stroke-width="1.6"></rect><path d="M1 8a5 5 0 0 0 10 0M6 13v4" fill="none" stroke="{{c.placeholder}}" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </label>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark ? {
      bg: '#000000', label: '#FFFFFF', secondary: 'rgba(235,235,245,0.6)', tertiary: 'rgba(235,235,245,0.3)',
      friend: '#262629', friendText: '#FFFFFF', placeholder: 'rgba(235,235,245,0.4)',
      glass: '#1C1C1E', glassShadow: '0 0 0 0.5px rgba(255,255,255,0.12), 0 4px 16px rgba(0,0,0,0.4)'
    } : {
      bg: '#FFFFFF', label: '#000000', secondary: 'rgba(60,60,67,0.6)', tertiary: 'rgba(60,60,67,0.3)',
      friend: '#E9E9EA', friendText: '#000000', placeholder: 'rgba(60,60,67,0.4)',
      glass: '#FAFAFA', glassShadow: '0 0 0 0.5px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.08)'
    };
    const script = [
      { time: ['Yesterday', '8:22 PM'] },
      { you: 'Did you get the photos from Saturday?' },
      { you: 'I can send them again' },
      { friend: 'Got them, thanks!' },
      { you: 'The one at the lake is my favorite' },
      { friend: 'Same. Can you print a copy for my mom?' },
      { time: ['Today', '9:41 AM'] },
      { friend: 'Are we still on for lunch tomorrow?' },
      { you: 'Yes! 12:30 at the usual place?' },
      { friend: 'Can we push it to 1? I have a call until 12:45.' },
      { you: '1 works' },
      { you: 'See you there' }
    ];
    const side = (s) => s.you !== undefined ? 'you' : s.friend !== undefined ? 'friend' : 'time';
    const items = script.map((s, i) => {
      const kind = side(s);
      const prev = i > 0 ? side(script[i - 1]) : null;
      const next = i + 1 < script.length ? side(script[i + 1]) : null;
      if (kind === 'time') {
        return { isTime: true, isBubble: false, day: s.time[0], time: s.time[1], margin: i === 0 ? '0 0 10px 0' : '10px 0' };
      }
      const mine = kind === 'you';
      const top = prev === null || prev === 'time' ? 0 : prev === kind ? 8 : 14;
      const bubbleBg = mine ? '#0088FF' : c.friend;
      return {
        isTime: false, isBubble: true, text: mine ? s.you : s.friend, tail: next !== kind,
        bubbleStyle: `align-self: ${mine ? 'flex-end' : 'flex-start'}; margin-top: ${top}px; background: ${bubbleBg}; color: ${mine ? '#FFFFFF' : c.friendText}`,
        tailStyle: mine ? `right: -7px; background: ${bubbleBg}; border-bottom-left-radius: 16px 14px` : `left: -7px; background: ${bubbleBg}; border-bottom-right-radius: 16px 14px`,
        cutStyle: mine ? `right: -10px; background: ${c.bg}; border-bottom-left-radius: 10px` : `left: -10px; background: ${c.bg}; border-bottom-right-radius: 10px`
      };
    });
    return { c, items };
  }
}
</script>
</body>
</html>
