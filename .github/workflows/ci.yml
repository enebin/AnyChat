name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  # The runtime's patch version must match the image exactly; the macos-26 image ships 26.4.1 for Xcode 26.4.1.
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test package
        run: xcodebuild test -scheme AnyChat -destination "$DESTINATION" -resultBundlePath "$RUNNER_TEMP/package.xcresult"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-xcresult
          path: ${{ runner.temp }}/package.xcresult

  # The UI tests take about 25 minutes in one job, so they run on pull requests only, split
  # across jobs by test name.
  quickstart:
    if: github.event_name != 'push'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD_COUNT: 3
    defaults:
      run:
        working-directory: Examples/QuickStart
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test demo app
        run: |
          tests=$(for file in QuickStartUITests/*.swift; do
            class=$(sed -nE 's/.*class ([A-Za-z0-9_]+): XCTestCase.*/\1/p' "$file" | head -1)
            [ -n "$class" ] && sed -nE "s|.*func (test[A-Za-z0-9_]+)\\(.*|-only-testing:QuickStartUITests/$class/\\1|p" "$file"
          done | sort | awk -v count="$SHARD_COUNT" -v shard="${{ matrix.shard }}" '(NR - 1) % count == shard')
          echo "$tests"
          xcodebuild test -project QuickStart.xcodeproj -scheme QuickStart -destination "$DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/quickstart.xcresult" $tests
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/quickstart.xcresult
