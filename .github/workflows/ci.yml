name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  # The runtime's patch version must match the image exactly; the macos-26 image ships 26.4.1 for Xcode 26.4.1.
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4.1

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test package
        run: xcodebuild test -scheme AnyChat -destination "$DESTINATION"

  quickstart:
    runs-on: macos-26
    defaults:
      run:
        working-directory: Examples/QuickStart
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test demo app
        run: xcodebuild test -project QuickStart.xcodeproj -scheme QuickStart -destination "$DESTINATION"
